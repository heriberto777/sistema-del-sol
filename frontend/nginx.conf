server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # /api/** va al backend dentro de la misma red de docker-compose —
    # el navegador nunca ve dos orígenes distintos, sea cual sea el
    # hostname público (app.dominio.com o <subdominio>.dominio.com),
    # así que no hace falta CORS para el tráfico real de la app.
    #
    # $api_upstream + resolver (DNS embebido de Docker) en vez de un
    # proxy_pass literal: con el hostname fijo, nginx lo resuelve una
    # sola vez AL ARRANCAR y si "api" no está levantado en ese instante
    # (todavía arrancando, o reiniciando por un deploy) nginx entero se
    # niega a arrancar — un contenedor `web` sano quedaba tumbado por uno
    # de `api` apenas más lento (visto en pruebas locales). Con variable,
    # la resolución es por request: si "api" no está, esa request
    # responde 502 en vez de tumbar todo el proxy.
    # Sin ruta después de la variable a propósito: con proxy_pass
    # variable, nginx NO reescribe el prefijo de location (ese
    # comportamiento solo aplica a un proxy_pass literal) — pasa la URI
    # original tal cual, que es justo lo que hace falta porque la API ya
    # usa /api como prefijo global (setGlobalPrefix('api') en main.ts).
    location /api/ {
        resolver 127.0.0.11 valid=10s;
        set $api_upstream http://api:3000;
        proxy_pass $api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # index.html nunca se cachea (referencia los hashes de los assets del
    # build actual) — el resto de los archivos de /assets sí, llevan hash
    # en el nombre y son inmutables.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # SPA: cualquier ruta que no sea un archivo real cae a index.html —
    # React Router (modo hostname o modo /tienda/:subdominio) resuelve el
    # resto en el cliente.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
