<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>El Sistema del Sol</title>
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/icon-maskable.svg" />
    <meta name="theme-color" content="#f59e0b" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <!-- Tienda Online (storefront público) — 3 plantillas, cada una con su propio par de tipografías. -->
    <link
      href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;700;800&family=Karla:wght@400;500;600&family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Work+Sans:wght@400;500;600&family=Cormorant+Garamond:wght@500;600;700&family=Jost:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <script>
      (function () {
        var guardado = localStorage.getItem('sol_tema');
        var oscuro = guardado === 'oscuro' || (!guardado && window.matchMedia('(prefers-color-scheme: dark)').matches);
        if (oscuro) document.documentElement.classList.add('dark');
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
