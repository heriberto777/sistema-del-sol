services:
  # postgres/redis ya no viven en este compose — este proyecto consume el
  # entorno compartido en C:\dev-infra (dev-postgres/dev-redis en los
  # puertos estándar del host), alcanzado desde los contenedores vía
  # host.docker.internal. Ver C:\dev-infra\docker-compose.yml.
  n8n:
    image: n8nio/n8n:latest
    restart: unless-stopped
    environment:
      N8N_HOST: ${N8N_HOST:-localhost}
      N8N_PORT: 5678
      N8N_PROTOCOL: http
      WEBHOOK_URL: ${N8N_WEBHOOK_URL:-http://localhost:5678/}
      GENERIC_TIMEZONE: America/Santo_Domingo
    ports:
      - "${N8N_PORT:-5678}:5678"
    volumes:
      - n8n_data:/home/node/.n8n
      - ./n8n/workflows:/workflows:ro
    entrypoint: ["/bin/sh"]
    # Importa las plantillas de n8n/workflows en cada arranque (n8n ignora
    # las que ya existen por id, así que es seguro repetirlo) y luego sigue
    # con el arranque normal. Ver n8n/README.md para configurarlas.
    command: ["-c", "n8n import:workflow --separate --input=/workflows || true; exec n8n start"]

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-sol}:${POSTGRES_PASSWORD:-sol}@host.docker.internal:5432/${POSTGRES_DB:-sistema_del_sol}
      APP_DATABASE_URL: postgresql://${APP_DB_USER:-sol_app}:${APP_DB_PASSWORD:-sol_app}@host.docker.internal:5432/${POSTGRES_DB:-sistema_del_sol}
      REDIS_URL: redis://host.docker.internal:6379
      # Usado solo para construir el link dentro del correo de "olvidé mi
      # contraseña" — debe ser la URL que el usuario realmente abre en su
      # navegador (el puerto host mapeado), no la del contenedor.
      FRONTEND_URL: http://localhost:${FRONTEND_PORT:-5173}
      # Fijo a propósito: el puerto DENTRO del contenedor siempre es 3000
      # (coincide con el EXPOSE del Dockerfile). BACKEND_PORT del .env del
      # host solo controla el lado izquierdo del mapeo de abajo — si se
      # dejara pasar tal cual vía env_file, la app escucharía en el puerto
      # del host dentro del contenedor y el mapeo de puertos apuntaría a
      # un puerto donde no hay nada escuchando.
      BACKEND_PORT: 3000
    ports:
      - "${BACKEND_PORT:-3000}:3000"
    volumes:
      - ./backend:/app
      - /app/node_modules
    extra_hosts:
      - "host.docker.internal:host-gateway"

  web:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    environment:
      # Dentro de este contenedor, 'localhost' es el propio contenedor —
      # el backend se alcanza por el nombre del servicio en la red de
      # docker-compose, no por localhost. Ver el comentario en
      # frontend/vite.config.ts.
      VITE_API_PROXY_TARGET: http://api:3000
      # Node 20 activa por defecto un algoritmo Happy-Eyeballs
      # (autoSelectFamily) en net.connect que, dentro de este contenedor,
      # hacía fallar la conexión del proxy de Vite hacia `api` con
      # AggregateError [ECONNREFUSED] pese a que una conexión HTTP
      # directa (sin ese mecanismo) funcionaba bien.
      NODE_OPTIONS: --no-network-family-autoselection
    ports:
      - "${FRONTEND_PORT:-5173}:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - api

volumes:
  n8n_data:
