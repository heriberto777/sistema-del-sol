name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: sol
          POSTGRES_PASSWORD: sol
          POSTGRES_DB: sistema_del_sol_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U sol"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      # RedisThrottlerStorage (backend/src/redis/) respalda el guard global
      # ThrottlerGuard — sin Redis, CUALQUIER request de los e2e falla con
      # MaxRetriesPerRequestError, no solo los de login.
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # connection_limit=20: sin esto, Prisma abre por defecto solo
      # `2 × núcleos + 1` conexiones — en el runner de 2 núcleos de GitHub
      # Actions son ~5, insuficientes para el test de concurrencia (10
      # facturas creadas con transacciones interactivas en paralelo, ver
      # app.e2e-spec.ts "reciben NCF únicos"): el resto hace cola esperando
      # conexión y excede el timeout de 5s de la transacción interactiva
      # (P2028 "Unable to start a transaction in the given time"). postgres:16
      # trae max_connections=100 por defecto, de sobra para 20.
      DATABASE_URL: postgresql://sol:sol@localhost:5432/sistema_del_sol_test?connection_limit=20
      # AppPrismaService (rol restringido de RLS en prod) lee esta variable
      # directo de process.env — sin ConfigModule de por medio, no hay
      # fallback. En CI no existe un rol `sol_app` separado (no se corre
      # db:app-role/db:rls acá) así que apunta a la MISMA base con el mismo
      # rol que DATABASE_URL — sin esto, TenantPrismaService lee/escribe
      # contra lo que sea que resuelva APP_DATABASE_URL fuera de este job
      # (bug real encontrado corriendo el e2e contra una base vacía por
      # primera vez: pasaba 84/180 con fallos sin sentido — CADA query
      # tenant-scoped iba a una base equivocada).
      APP_DATABASE_URL: postgresql://sol:sol@localhost:5432/sistema_del_sol_test?connection_limit=20
      REDIS_URL: redis://localhost:6379
      JWT_SECRET: test-secret
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.7.0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Crear .env de raíz (prisma:* lo cargan vía dotenv-cli)
        run: |
          echo "DATABASE_URL=$DATABASE_URL" >> .env
          echo "JWT_SECRET=$JWT_SECRET" >> .env
      - run: pnpm --filter ./backend prisma:generate
      - run: pnpm --filter ./backend prisma:migrate:deploy
      - run: pnpm --filter ./backend lint
      - run: pnpm --filter ./backend build
      - run: pnpm --filter ./backend test:cov
      - run: pnpm --filter ./backend test:e2e

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.7.0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter ./frontend lint
      - run: pnpm --filter ./frontend build
