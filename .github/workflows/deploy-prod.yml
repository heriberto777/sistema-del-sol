name: Deploy prod

# Publica las imágenes de producción a GHCR — no despliega por sí solo.
# En el servidor, después de un push a main:
#   docker compose -f docker-compose.prod.yml pull
#   docker compose -f docker-compose.prod.yml up -d
# (y `... exec api pnpm prisma:migrate:deploy` si el push trae migración
# nueva) — igual criterio manual que bonifapp/ciguacash/ciguainv en este
# servidor, sin SSH action ni credenciales del servidor en el repo.
on:
  workflow_run:
    workflows: [CI]
    branches: [main]
    types: [completed]

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    if: github.event.workflow_run.conclusion == 'success'
    strategy:
      matrix:
        target: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # El driver "docker" (default) no soporta exportar caché a
      # type=gha — buildx falla con "Cache export is not supported for
      # the docker driver". Este paso crea un builder con el driver
      # "docker-container", que sí lo soporta.
      - uses: docker/setup-buildx-action@v3

      - uses: docker/build-push-action@v6
        with:
          # Contexto = ./<target>, no la raíz — ver el comentario en
          # <target>/Dockerfile.prod (pnpm --filter desde la raíz del
          # workspace no resuelve bien los bins de devDependencies).
          context: ./${{ matrix.target }}
          file: ./${{ matrix.target }}/Dockerfile.prod
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/sistema-del-sol-${{ matrix.target }}:latest
            ghcr.io/${{ github.repository_owner }}/sistema-del-sol-${{ matrix.target }}:${{ github.event.workflow_run.head_sha }}
          cache-from: type=gha,scope=${{ matrix.target }}
          cache-to: type=gha,mode=max,scope=${{ matrix.target }}
